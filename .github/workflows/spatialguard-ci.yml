name: SpatialGuard release checks

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - run: npm ci
      - run: python -m pytest spatialguard/tests -q
      - run: python spatialguard/scripts/contracts.py && npm run contracts --workspace spatialguard-web && git diff --exit-code -- packages/contracts spatialguard/apps/web/src/generated.ts
      - run: npm run build --workspace spatialguard-web
      - run: npx playwright install --with-deps chromium
      - run: |
          docker build -t spatialguard-ci .
          # Host networking: the browser tests sign in as the local owner, which the
          # server only allows from 127.0.0.1 (a port mapping would arrive from the bridge).
          docker run -d --name spatialguard-ci --network host \
            -e SPATIALGUARD_ALLOWED_HOSTS=127.0.0.1:8010 \
            -e SPATIALGUARD_ORIGIN=http://127.0.0.1:8010 spatialguard-ci
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8010/health && break; sleep 2; done
          if ! curl -fsS http://127.0.0.1:8010/health; then
            # Surface the container's own output as an annotation, not only in the raw log.
            echo "::error title=Container did not start::$(docker logs spatialguard-ci 2>&1 | tail -25 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          # The github reporter turns each failing test into an annotation on the run.
          npm run test --workspace spatialguard-web -- --reporter=github,list
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - run: npm run android:sync --workspace spatialguard-web
      - run: cd spatialguard/apps/web/android && bash ./gradlew assembleDebug
      - run: npm audit --omit=dev --audit-level=high
      - run: python -m pip install bandit pip-licenses
      - run: bandit -q -r spatialguard/services/api/spatialguard_api -x spatialguard/tests
      - run: pip-licenses --format=json --output-file=.data-python-licenses.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
